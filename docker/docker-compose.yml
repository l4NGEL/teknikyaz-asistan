version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "src/llmops/dashboard.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    depends_on:
      - api
