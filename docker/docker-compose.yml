version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "src/llmops/dashboard.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    depends_on:
      - api

  chat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "src/serving/chat_app.py", "--server.address=0.0.0.0", "--server.port=8502"]
    ports:
      - "8502:8502"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - PYTHONUNBUFFERED=1

  # GPU gerekir. `docker compose --profile gpu up vllm`
  # OpenAI uyumlu API: http://localhost:8001/v1
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-3B-Instruct
      --max-model-len 2048
      --gpu-memory-utilization 0.85
    ports:
      - "8001:8000"
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
