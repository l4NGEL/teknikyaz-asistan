name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # GPU/LLM ağırlıklarını indirmeden CI'de çalışabilen alt kümeyi kuruyoruz;
          # tam kurulum (transformers/torch dahil) `requirements.txt` iledir.
          pip install ruff pytest pydantic fastapi torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Run unit tests
        run: pytest tests/ -v
